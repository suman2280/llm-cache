# Redis is the only containerized component for the MVP path.
# Redis 8 Open Source ships vector search (FT.* / VECTOR_RANGE) in the base
# image, so redis-stack is not required.
#
#   docker compose up -d redis
#   uv sync && uv run uvicorn llm_cache.app:app --port 8000
#
# Ollama runs natively on the host (http://localhost:11434) so the model stays
# resident in host RAM between proxy restarts.
services:
  redis:
    image: redis:8
    container_name: llm-cache-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

volumes:
  redis-data:
