[project]
name = "llm-cache"
version = "0.1.0"
description = "OpenAI-compatible caching proxy for Ollama (llama3.2:3b): exact + semantic tiers backed by Redis vector search, with a threshold-sweep benchmark."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "redis>=5.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "pydantic-settings>=2.0",
    "sentence-transformers>=3.0",
    "torch>=2.6",
]

# CPU-only torch (this project never uses a GPU); avoids ~2.5 GB of CUDA wheels.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.uv.build-backend]
module-name = "llm_cache"
module-root = "src"

[build-system]
requires = ["uv_build>=0.1"]
build-backend = "uv_build"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
